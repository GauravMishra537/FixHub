server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fixhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fixhub}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend:
    url: ${FRONTEND_URL:${VITE_FRONTEND_URL:http://localhost:5173}}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:gauravmishra277401@gmail.com}}
  jwt:
    secret: ${JWT_SECRET:YnmHd2Lm/HtzHdo29uvWctHV5c2eJP4Of7fVgQnrI0w=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:FixHub Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method